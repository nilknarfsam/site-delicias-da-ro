<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delícias da Rô | Página não encontrada</title>
  <meta name="robots" content="noindex">
  <script>
    // Leva para o início do site, no GitHub Pages (com a pasta do repositório) ou no domínio próprio.
    (function () {
      var partes = location.pathname.split('/').filter(Boolean);
      var base = location.hostname.endsWith('github.io') && partes.length ? '/' + partes[0] + '/' : '/';
      location.replace(base + '#/inicio');
    })();
  </script>
</head>
<body>
  <p>Página não encontrada. <a href="./#/inicio">Ir para o início da Delícias da Rô</a>.</p>
</body>
</html>
