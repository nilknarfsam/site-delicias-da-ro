<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Área da Rô | Delícias da Rô</title>
  <!-- Mesmo valor de --cor-fundo. -->
  <meta name="theme-color" content="#FFF7F5">
  <link rel="icon" type="image/png" sizes="32x32" href="../imagens/logo/logo-r-32.png">
  <link rel="apple-touch-icon" href="../imagens/logo/logo-r-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../imagens/logo/logo-r-192.png">

<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

        <a class="cabecalho__logo" href="#/inicio">
          <picture>
            <source srcset="../imagens/logo/logo-horizontal.webp" type="image/webp">
            <img src="../imagens/logo/logo-horizontal.png" width="552" height="200" alt="Delícias da Rô, início da Área da Rô">
          </picture>
        </a>
        <span id="cabecalho-atelie" class="cabecalho__atelie" hidden></span>
      </div>

      <div id="cabecalho-acoes" class="cabecalho__acoes" hidden>

          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Ajustes</span>
        </a>
        <button id="botao-sair" class="botao botao--contorno botao--compacto" type="button">Sair</button>
      </div>
    </div>
  </header>

  <div class="casca">
    <nav id="navegacao" class="navegacao" aria-label="Principal" hidden>
      <ul class="navegacao__lista">
        <li class="navegacao__item">
          <a class="navegacao__link" href="#/inicio" data-rota="inicio">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10.5 12 3l9 7.5"/>
              <path d="M5 9v11h14V9"/>
            </svg>
            <span>Início</span>
          </a>
        </li>
        <li class="navegacao__item">
          <a class="navegacao__link" href="#/dispensa" data-rota="dispensa">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2h12l2 5H4l2-5z"/>
              <rect x="4" y="7" width="16" height="15" rx="2"/>

            <span>Dispensa</span>
          </a>

            </svg>
            <span>Biblioteca</span>
          </a>
        </li>
        <li class="navegacao__item">
          <a class="navegacao__link" href="#/precificacao" data-rota="precificacao">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="2"/>
              <line x1="8" y1="6" x2="16" y2="6"/>
              <line x1="8" y1="11" x2="10" y2="11"/>
              <line x1="14" y1="11" x2="16" y2="11"/>
              <line x1="8" y1="16" x2="10" y2="16"/>
              <line x1="14" y1="16" x2="16" y2="16"/>
            </svg>
            <span>Precificação</span>
          </a>
        </li>
        <li class="navegacao__item">
          <a class="navegacao__link" href="#/orcamentos" data-rota="orcamentos">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="8" y1="13" x2="16" y2="13"/>
              <line x1="8" y1="17" x2="13" y2="17"/>
            </svg>
            <span>Orçamentos</span>
          </a>
        </li>
        <li class="navegacao__item navegacao__item--ajustes">
          <a class="navegacao__link" href="#/ajustes" data-rota="ajustes">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

      <noscript>
        <section class="painel painel--central">
          <h1>Área da Rô</h1>
          <p>Para acessar a Área da Rô e usar a precificação do ateliê, ative o JavaScript no seu navegador.</p>
        </section>
      </noscript>
    </main>

</html>
